name: release

# Push a tag like v1.2.0 to test, build the single-file exe and attach it (with its SHA-256) to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish single-file exe
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/PowerlineTool -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$v -o out
          Move-Item out/PowerlineTool.exe Powerline-Tool-win-x64.exe

      - name: Checksum
        id: hash
        run: |
          $h = (Get-FileHash Powerline-Tool-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Powerline-Tool-win-x64.exe" | Out-File -Encoding ascii Powerline-Tool-win-x64.exe.sha256
          "sha=$h" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: Powerline Tool ${{ github.ref_name }}
          files: |
            Powerline-Tool-win-x64.exe
            Powerline-Tool-win-x64.exe.sha256
          generate_release_notes: true
          body: |
            Windows 10/11, x64. Needs [Npcap](https://npcap.com). .NET is bundled.

            Tested on TP-Link TL-PA7017 (Broadcom). Qualcomm-based adapters are implemented but untested.

            **SHA-256:** `${{ steps.hash.outputs.sha }}`

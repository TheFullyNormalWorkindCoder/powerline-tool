name: release

# Push a tag like v1.0.0 to build the single-file exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish src/PowerlineTool -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out
      - name: Rename
        run: Move-Item out/PowerlineTool.exe Powerline-Tool-win-x64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: Powerline-Tool-win-x64.exe
          generate_release_notes: true
